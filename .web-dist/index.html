<!DOCTYPE html>
<html lang="en">
  <head>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const scene = params.get('scene') || '01_kpi_top';
  const STORAGE_KEY = 'expo_sqlite_web_students.db_students';

  const baseStudents = [
    { id: 1, name: 'Juan Dela Cruz', course: 'BS Computer Science', age: 20 },
    { id: 2, name: 'Maria Clara Santos', course: 'BS Information Technology', age: 21 },
    { id: 3, name: 'Gabriel Mendoza', course: 'BS Information Systems', age: 19 },
    { id: 4, name: 'Angela Mae Reyes', course: 'BS Computer Engineering', age: 22 },
    { id: 5, name: 'Joshua Villanueva', course: 'BS Data Science', age: 20 }
  ];

  const addedStudent = { id: 6, name: 'Kristine Joy Bautista', course: 'BS Cybersecurity', age: 21 };

  if (scene === '01_kpi_top' || scene === '02_student_list' || scene === '03_add_modal') {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(baseStudents));
  } else if (scene === '04_add_result' || scene === '05_update_modal') {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify([...baseStudents, addedStudent]));
  } else if (scene === '06_update_result' || scene === '07_delete_modal') {
    const updated = [...baseStudents, addedStudent].map(s =>
      s.id === 5 ? { ...s, course: 'BS Data Science & AI (Honors)', age: 21 } : s
    );
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
  } else if (scene === '08_delete_result') {
    const afterDelete = [...baseStudents, addedStudent]
      .map(s => (s.id === 5 ? { ...s, course: 'BS Data Science & AI (Honors)', age: 21 } : s))
      .filter(s => s.id !== 4);
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(afterDelete));
  }

  function setInputValue(input, val) {
    if (!input) return;
    const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(input, val);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function findClickableByText(text, index) {
    const idx = index || 0;
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const matches = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.trim() === text) {
        let el = node.parentElement;
        while (el && el !== document.body && el.getAttribute('tabindex') !== '0') {
          el = el.parentElement;
        }
        matches.push(el || node.parentElement);
      }
    }
    return matches[idx] || null;
  }

  function scrollDirectoryDown(px) {
    const allDivs = document.querySelectorAll('div');
    for (let i = 0; i < allDivs.length; i++) {
      const d = allDivs[i];
      const st = window.getComputedStyle(d);
      if ((st.overflowY === 'auto' || st.overflowY === 'scroll') && d.scrollHeight > d.clientHeight) {
        d.scrollTop = px;
      }
    }
  }

  window.addEventListener('load', function() {
    setTimeout(function() {
      if (scene === '02_student_list') {
        scrollDirectoryDown(310);
      } else if (scene === '03_add_modal') {
        const addBtn = findClickableByText('Add Student', 0);
        if (addBtn) addBtn.click();
        setTimeout(function() {
          const inputs = document.querySelectorAll('input');
          setInputValue(inputs[0], 'Kristine Joy Bautista');
          setInputValue(inputs[1], 'BS Cybersecurity');
          setInputValue(inputs[2], '21');
        }, 350);
      } else if (scene === '04_add_result') {
        scrollDirectoryDown(290);
      } else if (scene === '05_update_modal') {
        const updateBtn = findClickableByText('Update', 1);
        if (updateBtn) updateBtn.click();
        setTimeout(function() {
          const inputs = document.querySelectorAll('input');
          setInputValue(inputs[1], 'BS Data Science & AI (Honors)');
          setInputValue(inputs[2], '21');
        }, 350);
      } else if (scene === '06_update_result') {
        scrollDirectoryDown(290);
      } else if (scene === '07_delete_modal') {
        scrollDirectoryDown(290);
        const delBtn = findClickableByText('Delete', 2);
        if (delBtn) delBtn.click();
      } else if (scene === '08_delete_result') {
        scrollDirectoryDown(290);
      }
    }, 900);
  });
})();
</script>
