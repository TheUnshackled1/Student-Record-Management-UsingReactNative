<!DOCTYPE html>
<html lang="en">
  <head>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const scene = params.get('scene') || 'mm_01_banner';
  const STORAGE_KEY = 'expo_sqlite_web_students.db_students';

  const baseStudents = [
    { id: 1, name: 'Juan Dela Cruz', course: 'BS Computer Science', age: 20 },
    { id: 2, name: 'Maria Clara Santos', course: 'BS Information Technology', age: 21 },
    { id: 3, name: 'Gabriel Mendoza', course: 'BS Information Systems', age: 19 },
    { id: 4, name: 'Angela Mae Reyes', course: 'BS Computer Engineering', age: 22 },
    { id: 5, name: 'Joshua Villanueva', course: 'BS Data Science', age: 20 }
  ];
  window.localStorage.setItem(STORAGE_KEY, JSON.stringify(baseStudents));

  function findClickableByText(text, index) {
    const idx = index || 0;
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const matches = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.trim() === text) {
        let el = node.parentElement;
        while (el && el !== document.body && el.getAttribute('tabindex') !== '0') {
          el = el.parentElement;
        }
        matches.push(el || node.parentElement);
      }
    }
    return matches[idx] || null;
  }

  function scrollDirectoryDown(px) {
    const allDivs = document.querySelectorAll('div');
    for (let i = 0; i < allDivs.length; i++) {
      const d = allDivs[i];
      const st = window.getComputedStyle(d);
      if ((st.overflowY === 'auto' || st.overflowY === 'scroll') && d.scrollHeight > d.clientHeight) {
        d.scrollTop = px;
      }
    }
  }

  window.addEventListener('load', function() {
    setTimeout(function() {
      if (scene === 'mm_01_banner') {
        // Default screen load showing Image Banner + Entrance Fade-In Animation
      } else if (scene === 'mm_02_audio') {
        const bgmBtn = findClickableByText('Play BGM', 0);
        if (bgmBtn) bgmBtn.click();
        setTimeout(function() {
          const sfxBtn = findClickableByText('Tap SFX', 0);
          if (sfxBtn) sfxBtn.click();
        }, 250);
      } else if (scene === 'mm_03_video_play') {
        scrollDirectoryDown(260);
        const playVideoBtn = findClickableByText('Play Video', 0);
        if (playVideoBtn) playVideoBtn.click();
      } else if (scene === 'mm_04_video_pause') {
        scrollDirectoryDown(260);
        const playVideoBtn = findClickableByText('Play Video', 0);
        if (playVideoBtn) playVideoBtn.click();
        setTimeout(function() {
          const pauseVideoBtn = findClickableByText('Pause Video', 0);
          if (pauseVideoBtn) pauseVideoBtn.click();
        }, 400);
      } else if (scene === 'mm_05_animation') {
        const bgmBtn = findClickableByText('Play BGM', 0);
        if (bgmBtn) bgmBtn.click();
        setTimeout(function() {
          const bounceBtn = findClickableByText('Bounce', 0);
          if (bounceBtn) bounceBtn.click();
        }, 250);
      } else if (scene === 'mm_06_integrated') {
        scrollDirectoryDown(540);
      }
    }, 900);
  });
})();
</script>
