<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="940" height="240" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="20" y="16" width="900" height="44" rx="12" fill="url(#hdrGrad)"/>
  <text x="470" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="800">
    DEVELOPER CONTRIBUTION WORKFLOW (FORK → BRANCH → CODE → TEST → PUSH)
  </text>

  <!-- Step 1: Fork & Clone -->
  <g filter="url(#shadow)" transform="translate(20, 82)">
    <rect width="160" height="132" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2563EB"/>
    <text x="29" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">1</text>
    <text x="52" y="34" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Fork &amp; Clone</text>
    <text x="14" y="64" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10.5" font-weight="700">git clone ...</text>
    <text x="14" y="82" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10.5" font-weight="700">npm install</text>
    <text x="14" y="112" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Setup Expo &amp; SQLite</text>
  </g>

  <path d="M184 148 L202 148" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="200,143 209,148 200,153" fill="#3B82F6"/>

  <!-- Step 2: Feature Branch -->
  <g filter="url(#shadow)" transform="translate(212, 82)">
    <rect width="160" height="132" rx="14" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#9333EA"/>
    <text x="29" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">2</text>
    <text x="52" y="34" fill="#581C87" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Create Branch</text>
    <text x="14" y="64" fill="#7E22CE" font-family="Consolas, monospace" font-size="10.5" font-weight="700">git checkout -b</text>
    <text x="14" y="82" fill="#7E22CE" font-family="Consolas, monospace" font-size="10.5" font-weight="700">feature/name</text>
    <text x="14" y="112" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Isolated feature work</text>
  </g>

  <path d="M376 148 L394 148" stroke="#9333EA" stroke-width="2.5"/>
  <polygon points="392,143 401,148 392,153" fill="#9333EA"/>

  <!-- Step 3: Implement Changes -->
  <g filter="url(#shadow)" transform="translate(404, 82)">
    <rect width="160" height="132" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#D97706"/>
    <text x="29" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">3</text>
    <text x="52" y="34" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Write Code</text>
    <text x="14" y="64" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">• SQLite CRUD (db.ts)</text>
    <text x="14" y="82" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">• Multi-Theme UI</text>
    <text x="14" y="112" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">• Audio/Video Studio</text>
  </g>

  <path d="M568 148 L586 148" stroke="#D97706" stroke-width="2.5"/>
  <polygon points="584,143 593,148 584,153" fill="#D97706"/>

  <!-- Step 4: Verify & Test -->
  <g filter="url(#shadow)" transform="translate(596, 82)">
    <rect width="152" height="132" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#059669"/>
    <text x="29" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">4</text>
    <text x="52" y="34" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Run Tests</text>
    <text x="14" y="64" fill="#047857" font-family="Consolas, monospace" font-size="10.5" font-weight="700">npm run typecheck</text>
    <text x="14" y="82" fill="#047857" font-family="Consolas, monospace" font-size="10.5" font-weight="700">npm test</text>
    <text x="14" y="112" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">11/11 Jest checks pass</text>
  </g>

  <path d="M752 148 L770 148" stroke="#059669" stroke-width="2.5"/>
  <polygon points="768,143 777,148 768,153" fill="#059669"/>

  <!-- Step 5: Commit & Push -->
  <g filter="url(#shadow)" transform="translate(780, 82)">
    <rect width="140" height="132" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#1D4ED8"/>
    <text x="29" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">5</text>
    <text x="50" y="34" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Push PR</text>
    <text x="14" y="64" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10.5" font-weight="700">git commit -m</text>
    <text x="14" y="82" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10.5" font-weight="700">git push origin</text>
    <text x="14" y="112" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Open GitHub PR</text>
  </g>
</svg>
