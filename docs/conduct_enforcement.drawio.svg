<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="320" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="20" y="18" width="880" height="46" rx="12" fill="url(#headerGrad)"/>
  <text x="460" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">
    CODE OF CONDUCT — REPORTING &amp; 4-TIER ENFORCEMENT PIPELINE
  </text>

  <!-- Step 1: Report Submitted -->
  <g filter="url(#cardShadow)" transform="translate(24, 92)">
    <rect width="190" height="86" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#2563EB"/>
    <text x="30" y="36" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">1</text>
    <text x="56" y="28" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Incident Report</text>
    <text x="56" y="44" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Private Email / Dept</text>
    <text x="14" y="68" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">jtcoronel.chmsu@gmail.com</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M218 135 L248 135" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="246,130 256,135 246,140" fill="#3B82F6"/>

  <!-- Step 2: Maintainer Review -->
  <g filter="url(#cardShadow)" transform="translate(260, 92)">
    <rect width="190" height="86" rx="14" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#9333EA"/>
    <text x="30" y="36" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">2</text>
    <text x="56" y="28" fill="#581C87" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Fair Investigation</text>
    <text x="56" y="44" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Confidential Review</text>
    <text x="14" y="68" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Reporter privacy protected</text>
  </g>

  <!-- Arrow 2 -> Tiers -->
  <path d="M454 135 L484 135" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="482,130 492,135 482,140" fill="#9333EA"/>

  <!-- 4 Enforcement Tiers Container -->
  <g transform="translate(496, 80)">
    <rect width="400" height="216" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="200" y="22" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">
      ENFORCEMENT GUIDELINES (SEVERITY TIERS)
    </text>

    <!-- Tier 1: Correction (Emerald) -->
    <rect x="14" y="34" width="180" height="78" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
    <text x="26" y="54" fill="#065F46" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Tier 1: Correction</text>
    <text x="26" y="72" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Private written notice</text>
    <text x="26" y="88" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">clarifying violation</text>

    <!-- Tier 2: Warning (Blue) -->
    <rect x="206" y="34" width="180" height="78" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="218" y="54" fill="#1E40AF" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Tier 2: Warning</text>
    <text x="218" y="72" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Formal warning with</text>
    <text x="218" y="88" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">defined consequences</text>

    <!-- Tier 3: Temporary Ban (Amber) -->
    <rect x="14" y="124" width="180" height="78" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="26" y="144" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Tier 3: Temporary Ban</text>
    <text x="26" y="162" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Time-limited suspension</text>
    <text x="26" y="178" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">from project interaction</text>

    <!-- Tier 4: Permanent Ban (Rose/Red) -->
    <rect x="206" y="124" width="180" height="78" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
    <text x="218" y="144" fill="#991B1B" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Tier 4: Permanent Ban</text>
    <text x="218" y="162" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Permanent removal for</text>
    <text x="218" y="178" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">egregious violations</text>
  </g>

  <!-- Bottom Community Pledge Banner -->
  <rect x="24" y="200" width="426" height="96" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <text x="42" y="226" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">
    ✓ Contributor Covenant v2.1 Standard
  </text>
  <text x="42" y="248" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    • Welcoming, inclusive, and harassment-free community
  </text>
  <text x="42" y="268" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600">
    • Applies to GitHub Issues, PRs, Discussions &amp; Project Spaces
  </text>
</svg>
