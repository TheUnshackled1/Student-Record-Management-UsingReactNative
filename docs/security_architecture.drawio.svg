<svg xmlns="http://www.w3.org/2000/svg" width="940" height="270" viewBox="0 0 940 270">
  <defs>
    <linearGradient id="secHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="48%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="secShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="940" height="270" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="20" y="16" width="900" height="44" rx="12" fill="url(#secHdr)"/>
  <text x="470" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="800">
    SECURITY ARCHITECTURE — 4 DEFENSE-IN-DEPTH LAYERS
  </text>

  <!-- Layer 1: UI Gate & Input Validation -->
  <g filter="url(#secShadow)" transform="translate(20, 80)">
    <rect width="206" height="164" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <rect x="14" y="14" width="178" height="28" rx="7" fill="#D97706"/>
    <text x="103" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">LAYER 1: UI &amp; INPUT GATE</text>
    <text x="16" y="64" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• validateStudentInput()</text>
    <text x="16" y="84" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Trims strings &amp; blocks empty</text>
    <text x="16" y="102" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  inputs; enforces age 1–120</text>
    <text x="16" y="128" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• DeleteConfirmModal</text>
    <text x="16" y="146" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Guards destructive DELETEs</text>
  </g>

  <path d="M230 162 L248 162" stroke="#D97706" stroke-width="2.5"/>
  <polygon points="246,157 255,162 246,167" fill="#D97706"/>

  <!-- Layer 2: Strict TypeScript Contracts -->
  <g filter="url(#secShadow)" transform="translate(258, 80)">
    <rect width="196" height="164" rx="14" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
    <rect x="14" y="14" width="168" height="28" rx="7" fill="#9333EA"/>
    <text x="98" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">LAYER 2: TYPE SAFETY</text>
    <text x="16" y="64" fill="#581C87" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• TypeScript (strict: true)</text>
    <text x="16" y="84" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Enforces Student &amp; StudentInput</text>
    <text x="16" y="102" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  schema contracts at build time</text>
    <text x="16" y="128" fill="#581C87" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• Jest QA Suite (11 Tests)</text>
    <text x="16" y="146" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Verifies validation &amp; CRUD</text>
  </g>

  <path d="M458 162 L476 162" stroke="#9333EA" stroke-width="2.5"/>
  <polygon points="474,157 483,162 474,167" fill="#9333EA"/>

  <!-- Layer 3: Parameterized SQL Engine -->
  <g filter="url(#secShadow)" transform="translate(486, 80)">
    <rect width="206" height="164" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="14" y="14" width="178" height="28" rx="7" fill="#2563EB"/>
    <text x="103" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">LAYER 3: SQLITE BINDING</text>
    <text x="16" y="64" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• Parameterized Queries (?)</text>
    <text x="16" y="84" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10" font-weight="700">  VALUES (?, ?, ?)</text>
    <text x="16" y="102" fill="#1D4ED8" font-family="Consolas, monospace" font-size="10" font-weight="700">  WHERE id = ?</text>
    <text x="16" y="128" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• Zero String Concatenation</text>
    <text x="16" y="146" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Prevents SQL injection attacks</text>
  </g>

  <path d="M696 162 L714 162" stroke="#2563EB" stroke-width="2.5"/>
  <polygon points="712,157 721,162 712,167" fill="#2563EB"/>

  <!-- Layer 4: Sandboxed Storage -->
  <g filter="url(#secShadow)" transform="translate(724, 80)">
    <rect width="196" height="164" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="168" height="28" rx="7" fill="#059669"/>
    <text x="98" y="33" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">LAYER 4: STORAGE ISOLATION</text>
    <text x="16" y="64" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• Native OS App Sandbox</text>
    <text x="16" y="84" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  expo-sqlite (students.db)</text>
    <text x="16" y="102" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  PRAGMA journal_mode = WAL</text>
    <text x="16" y="128" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800">• HTTPS Same-Origin Web</text>
    <text x="16" y="146" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">  Vercel TLS origin isolation</text>
  </g>
</svg>
