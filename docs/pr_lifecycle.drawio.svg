<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <defs>
    <linearGradient id="prGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="prShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="230" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="20" y="16" width="880" height="44" rx="12" fill="url(#prGrad)"/>
  <text x="460" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="800">
    PULL REQUEST REVIEW &amp; VERCEL DEPLOYMENT LIFECYCLE
  </text>

  <!-- Stage 1 -->
  <g filter="url(#prShadow)" transform="translate(24, 80)">
    <rect width="196" height="124" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="18" y="30" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800">1. Open Pull Request</text>
    <text x="18" y="54" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• Target: main branch</text>
    <text x="18" y="74" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• Clear summary &amp; diff</text>
    <text x="18" y="94" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">• Attach UI screenshots</text>
  </g>

  <path d="M224 142 L244 142" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="242,137 251,142 242,147" fill="#3B82F6"/>

  <!-- Stage 2 -->
  <g filter="url(#prShadow)" transform="translate(254, 80)">
    <rect width="196" height="124" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="18" y="30" fill="#78350F" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800">2. Automated QA</text>
    <text x="18" y="54" fill="#B45309" font-family="Consolas, monospace" font-size="10.5" font-weight="700">✓ tsc --noEmit</text>
    <text x="18" y="74" fill="#B45309" font-family="Consolas, monospace" font-size="10.5" font-weight="700">✓ jest --watchAll=false</text>
    <text x="18" y="94" fill="#475569" font-family="Consolas, monospace" font-size="10.5" font-weight="700">✓ npm run build</text>
  </g>

  <path d="M454 142 L474 142" stroke="#D97706" stroke-width="2.5"/>
  <polygon points="472,137 481,142 472,147" fill="#D97706"/>

  <!-- Stage 3 -->
  <g filter="url(#prShadow)" transform="translate(484, 80)">
    <rect width="196" height="124" rx="14" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
    <text x="18" y="30" fill="#581C87" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800">3. Maintainer Review</text>
    <text x="18" y="54" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• SQLite query safety</text>
    <text x="18" y="74" fill="#7E22CE" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• Theme &amp; SVG consistency</text>
    <text x="18" y="94" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">• Mobile &amp; Web parity</text>
  </g>

  <path d="M684 142 L704 142" stroke="#9333EA" stroke-width="2.5"/>
  <polygon points="702,137 711,142 702,147" fill="#9333EA"/>

  <!-- Stage 4 -->
  <g filter="url(#prShadow)" transform="translate(714, 80)">
    <rect width="182" height="124" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="18" y="30" fill="#064E3B" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800">4. Merge &amp; Deploy</text>
    <text x="18" y="54" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• Squash &amp; Merge to main</text>
    <text x="18" y="74" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">• Auto-deploy to Vercel</text>
    <text x="18" y="94" fill="#065F46" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">✓ Live in Production</text>
  </g>
</svg>
